<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!--
    Estos valores del <head> (title, description, Open Graph, JSON-LD) están escritos acá
    a mano porque los buscadores y las redes sociales necesitan leerlos sin ejecutar JavaScript.
    Si cambiás datos del negocio en js/config.js (dirección, teléfono, horarios, sucursal),
    actualizá también estos mismos datos acá para que no queden desincronizados.
  -->

  <title>Heladería en Don Orione | Sei Tu — Delivery de helado en Claypole</title>
  <meta
    name="description"
    content="Sei Tu Don Orione: heladería y cafetería en Av. Eva Perón 2680, Don Orione, Claypole. Pedí tu helado con delivery de 19 a 00hs o retiralo en el local. Abierto todos los días de 11 a 22hs."
  />
  <link rel="canonical" href="https://www.seitudonorione.com.ar/" />
  <meta name="theme-color" content="#29ABE2" />
  <meta name="robots" content="index, follow" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:site_name" content="Sei Tu Don Orione" />
  <meta property="og:title" content="Heladería en Don Orione | Sei Tu — Delivery de helado en Claypole" />
  <meta
    property="og:description"
    content="Heladería y cafetería en Av. Eva Perón 2680, Don Orione, Claypole. Pedí online y recibilo por delivery o retiralo en el local."
  />
  <meta property="og:image" content="https://www.seitudonorione.com.ar/assets/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://www.seitudonorione.com.ar/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Heladería en Don Orione | Sei Tu — Delivery de helado en Claypole" />
  <meta
    name="twitter:description"
    content="Heladería y cafetería en Av. Eva Perón 2680, Don Orione, Claypole. Pedí online y recibilo por delivery o retiralo en el local."
  />
  <meta name="twitter:image" content="https://www.seitudonorione.com.ar/assets/og-image.svg" />

  <!-- CSS: no hay fuentes externas que bloqueen el render (usamos fuentes del sistema) -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- JSON-LD: negocio (IceCreamShop, subtipo de FoodEstablishment/LocalBusiness) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "IceCreamShop",
    "name": "Sei Tu Don Orione",
    "image": "https://www.seitudonorione.com.ar/assets/hero.svg",
    "url": "https://www.seitudonorione.com.ar/",
    "telephone": "+5491136085617",
    "priceRange": "$$",
    "servesCuisine": "Helados y cafetería",
    "acceptsReservations": false,
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Av. Eva Perón 2680",
      "addressLocality": "Claypole",
      "addressRegion": "Buenos Aires",
      "postalCode": "1888",
      "addressCountry": "AR"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": -34.8817,
      "longitude": -58.3958
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "11:00",
        "closes": "22:00"
      }
    ],
    "sameAs": [
      "https://www.instagram.com/seitu_donorione",
      "https://maps.app.goo.gl/zoP78fGRDsccdYRg6"
    ],
    "hasMenu": "https://www.seitudonorione.com.ar/#catalogo"
  }
  </script>

  <!-- JSON-LD: menú principal -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Menu",
    "name": "Menú Sei Tu Don Orione",
    "hasMenuSection": [
      {
        "@type": "MenuSection",
        "name": "Cucuruchos",
        "hasMenuItem": [
          { "@type": "MenuItem", "name": "Cucurucho 1 bocha", "offers": { "@type": "Offer", "price": "3000", "priceCurrency": "ARS" } },
          { "@type": "MenuItem", "name": "Cucurucho 2 bochas", "offers": { "@type": "Offer", "price": "3800", "priceCurrency": "ARS" } },
          { "@type": "MenuItem", "name": "Cucurucho 3 bochas", "offers": { "@type": "Offer", "price": "5000", "priceCurrency": "ARS" } }
        ]
      },
      {
        "@type": "MenuSection",
        "name": "Potes",
        "hasMenuItem": [
          { "@type": "MenuItem", "name": "Pote 1/4 kilo", "offers": { "@type": "Offer", "price": "6000", "priceCurrency": "ARS" } },
          { "@type": "MenuItem", "name": "Pote 1/2 kilo", "offers": { "@type": "Offer", "price": "10000", "priceCurrency": "ARS" } },
          { "@type": "MenuItem", "name": "Pote 1 kilo", "offers": { "@type": "Offer", "price": "16000", "priceCurrency": "ARS" } },
          { "@type": "MenuItem", "name": "Pote 2 kilos", "offers": { "@type": "Offer", "price": "30000", "priceCurrency": "ARS" } }
        ]
      }
    ]
  }
  </script>

  <!-- Scripts con defer: no bloquean el render y se ejecutan en orden antes de DOMContentLoaded -->
  <script src="js/config.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/whatsapp.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Anuncia cambios de estado a lectores de pantalla (ej. "producto agregado") -->
  <div id="anunciador" class="visualmente-oculto" role="status" aria-live="polite"></div>

  <!-- Banner "Abierto ahora / Cerrado" — se calcula en vivo en app.js -->
  <div id="banner-horario" class="banner-horario" role="status"></div>

  <header class="site-header">
    <img id="logo-img" class="logo-img" src="" alt="" width="44" height="44" />
    <div class="site-header-info">
      <p id="hero-nombre-header" class="visualmente-oculto">Sei Tu Don Orione</p>
    </div>
  </header>

  <section class="hero">
    <img id="hero-img" class="hero-img" src="" alt="" width="280" height="210" fetchpriority="high" />
    <div class="hero-card">
      <h1 id="hero-nombre"></h1>
      <p id="hero-direccion"></p>
      <p id="hero-horario"></p>
    </div>
    <button id="btn-pedir-ahora" class="btn btn-primario btn-pedir-ahora" type="button">Pedir ahora</button>
  </section>

  <nav id="categorias-nav" class="categorias-nav" aria-label="Categorías de productos"></nav>

  <main>
    <section id="catalogo" aria-label="Catálogo de productos"></section>

    <section class="sabores-section" id="sabores" aria-label="Sabores de helado">
      <h2>Nuestros sabores de helado</h2>
      <div id="sabores-filtros" class="sabores-filtros"></div>
      <div id="sabores-lista" class="sabores-lista"></div>
    </section>

    <div class="contenido-seo">
      <section aria-labelledby="seo-como-pedir-titulo">
        <h2 id="seo-como-pedir-titulo"></h2>
        <p id="seo-como-pedir-texto"></p>
      </section>

      <section aria-labelledby="seo-zonas-titulo">
        <h2 id="seo-zonas-titulo"></h2>
        <p id="seo-zonas-texto"></p>
        <ul id="seo-zonas-lista"></ul>
      </section>

      <section aria-labelledby="seo-donde-titulo">
        <h2 id="seo-donde-titulo"></h2>
        <p id="seo-donde-texto"></p>
        <p><a id="link-maps" href="#" target="_blank" rel="noopener">Ver en Google Maps</a></p>
        <div class="mapa-wrapper">
          <iframe
            id="mapa-embed"
            src=""
            title=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p id="footer-nombre"></p>
    <p id="footer-direccion"></p>
    <p id="footer-horario-local"></p>
    <p id="footer-horario-delivery"></p>
    <p><a id="footer-instagram" href="#" target="_blank" rel="noopener"></a></p>
    <p><a id="footer-telefono" href="#"></a></p>
  </footer>

  <!-- Botón flotante de WhatsApp para consultas generales (no forma parte del flujo de pedido) -->
  <a id="whatsapp-flotante" class="whatsapp-flotante" href="#" target="_blank" rel="noopener" aria-label="Consultar por WhatsApp">💬</a>

  <!-- Barra flotante del carrito -->
  <div id="carrito-flotante" class="carrito-flotante" hidden></div>

  <!-- Contenedor de modales (producto / carrito / checkout) -->
  <div id="modal-root" hidden></div>
</body>
</html>
